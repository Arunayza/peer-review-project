<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UOB x Ruangguru: Peer Review & Feedback Lab</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 text-slate-800 h-full flex flex-col font-sans selection:bg-indigo-500 selection:text-white">

    <!-- Navbar -->
    <header class="bg-indigo-600 text-white shadow-md py-3.5 px-6 flex justify-between items-center z-20">
        <div class="flex items-center space-x-3">
            <div class="bg-white text-indigo-600 p-2 rounded-xl shadow font-bold flex items-center justify-center w-10 h-10">
                <i class="fa-solid fa-laptop-code text-lg"></i>
            </div>
            <div>
                <h1 class="font-bold text-base sm:text-lg leading-tight">UOB x Ruangguru</h1>
                <p class="text-xs text-indigo-200">Peer Review & Interactive App Testing Platform</p>
            </div>
        </div>
        <div id="navbar-auth-info" class="hidden items-center space-x-3 bg-indigo-700/80 px-4 py-2 rounded-xl border border-indigo-500/50 text-xs">
            <div>
                <span id="nav-role-badge" class="text-indigo-200 block text-[10px] uppercase font-semibold">Role</span>
                <span id="nav-user-name" class="font-bold text-white"></span>
            </div>
            <button onclick="handleLogout()" class="bg-indigo-800 hover:bg-indigo-900 text-indigo-100 px-2.5 py-1.5 rounded-lg transition font-medium text-[11px]">
                <i class="fa-solid fa-right-from-bracket mr-1"></i> Keluar
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 overflow-y-auto p-4 sm:p-6 md:p-8 max-w-6xl w-full mx-auto" id="app-container">
        <!-- Rendered via JS -->
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-3 text-center text-xs text-slate-500">
        UOB x Ruangguru Peer Review &bull; Real-time Firebase Cloud
    </footer>

    <!-- Toast Container -->
    <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <!-- Script Modules -->
    <script type="module" src="js/firebase.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
